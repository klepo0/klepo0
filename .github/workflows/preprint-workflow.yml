name: Update recent arXiv preprints
on:
  schedule: # Run automatically
    - cron: '0 * * * *' # Every hour, on the hour
  workflow_dispatch: # Allow manual runs from the Actions tab

jobs:
  update-readme-with-preprints:
    name: Update the README with the latest arXiv preprints
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull in arXiv preprints
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "PREPRINT-LIST"
          feed_list: "https://arxiv.org/a/le_k_2.atom2"
          custom_tags: "author/author/, abstract/summary/"
          date_format: "yyyy"
          commit_message: "Update recent arXiv preprints"
          template: "<li><a href=\"$url\"><strong>$title</strong></a> ($date)<br>$author<details><summary>Abstract</summary><p>$abstract</p></details></li>"
